<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/>
    <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c"><rect x="0" y="0" width="1200" height="70"/></clipPath>
</defs>
<g transform="translate(46 32)">
  <rect x="-9" y="-9" width="18" height="18" rx="3" fill="url(#g)">
    <animateTransform attributeName="transform" type="rotate" values="45;225;405" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle r="16" fill="none" stroke="#22D3EE" stroke-opacity="0.5">
    <animate attributeName="r" values="12;24" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</g>
<text x="80" y="43" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="1" fill="url(#g)">About Me
  <animate attributeName="opacity" values="0.0;1" dur="0.8s" fill="freeze"/>
</text>
<rect x="30" y="58" width="1140" height="2" rx="1" fill="#8B5CF6" opacity="0.25"/>
<g clip-path="url(#c)">
  <rect x="-200" y="57" width="200" height="4" rx="2" fill="url(#spark)">
    <animateTransform attributeName="transform" type="translate" values="0 0;1400 0" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>